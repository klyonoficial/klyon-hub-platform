<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#30cfd0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#330867;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient3)"/>
  
  <!-- Stage -->
  <rect x="100" y="400" width="600" height="80" rx="15" fill="url(#stageGradient)" opacity="0.9"/>
  <rect x="120" y="420" width="560" height="40" rx="8" fill="#ffffff" opacity="0.2"/>
  
  <!-- Stage lights -->
  <circle cx="200" cy="380" r="25" fill="#ffffff" opacity="0.6"/>
  <circle cx="400" cy="360" r="30" fill="#ffffff" opacity="0.7"/>
  <circle cx="600" cy="380" r="25" fill="#ffffff" opacity="0.6"/>
  
  <!-- Seats rows -->
  <g transform="translate(150, 200)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="40" y="0" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="80" y="0" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="120" y="0" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="160" y="0" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="200" y="0" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="240" y="0" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="280" y="0" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="320" y="0" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="360" y="0" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    
    <!-- Row 2 -->
    <rect x="10" y="50" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="50" y="50" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="90" y="50" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="130" y="50" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="170" y="50" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="210" y="50" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="250" y="50" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="290" y="50" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="330" y="50" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="370" y="50" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    
    <!-- Row 3 -->
    <rect x="0" y="100" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="40" y="100" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="80" y="100" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="120" y="100" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="160" y="100" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="200" y="100" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="240" y="100" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="280" y="100" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="320" y="100" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="360" y="100" width="30" height="30" rx="5" fill="#ffffff" opacity="0.5"/>
  </g>
  
  <!-- Projection screen -->
  <rect x="250" y="120" width="300" height="60" rx="5" fill="#ffffff" opacity="0.4" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- Decorative elements -->
  <circle cx="80" cy="100" r="35" fill="#ffffff" opacity="0.1"/>
  <circle cx="720" cy="150" r="40" fill="#ffffff" opacity="0.1"/>
</svg>
