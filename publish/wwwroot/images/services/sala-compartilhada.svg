<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="deskGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- Floor -->
  <rect x="0" y="450" width="800" height="150" fill="#2d3748" opacity="0.3"/>
  
  <!-- Desks -->
  <g transform="translate(100, 300)">
    <!-- Desk 1 -->
    <rect x="0" y="0" width="120" height="80" rx="8" fill="url(#deskGradient)" opacity="0.9"/>
    <rect x="10" y="10" width="100" height="60" rx="4" fill="#ffffff" opacity="0.2"/>
    <circle cx="60" cy="40" r="15" fill="#ffffff" opacity="0.3"/>
    
    <!-- Desk 2 -->
    <rect x="180" y="0" width="120" height="80" rx="8" fill="url(#deskGradient)" opacity="0.9"/>
    <rect x="190" y="10" width="100" height="60" rx="4" fill="#ffffff" opacity="0.2"/>
    <circle cx="240" cy="40" r="15" fill="#ffffff" opacity="0.3"/>
    
    <!-- Desk 3 -->
    <rect x="360" y="0" width="120" height="80" rx="8" fill="url(#deskGradient)" opacity="0.9"/>
    <rect x="370" y="10" width="100" height="60" rx="4" fill="#ffffff" opacity="0.2"/>
    <circle cx="420" cy="40" r="15" fill="#ffffff" opacity="0.3"/>
    
    <!-- Desk 4 -->
    <rect x="540" y="0" width="120" height="80" rx="8" fill="url(#deskGradient)" opacity="0.9"/>
    <rect x="550" y="10" width="100" height="60" rx="4" fill="#ffffff" opacity="0.2"/>
    <circle cx="600" cy="40" r="15" fill="#ffffff" opacity="0.3"/>
  </g>
  
  <!-- People silhouettes -->
  <g transform="translate(150, 250)">
    <circle cx="0" cy="0" r="20" fill="#ffffff" opacity="0.4"/>
    <rect x="-15" y="20" width="30" height="40" rx="15" fill="#ffffff" opacity="0.4"/>
  </g>
  
  <g transform="translate(330, 250)">
    <circle cx="0" cy="0" r="20" fill="#ffffff" opacity="0.4"/>
    <rect x="-15" y="20" width="30" height="40" rx="15" fill="#ffffff" opacity="0.4"/>
  </g>
  
  <g transform="translate(510, 250)">
    <circle cx="0" cy="0" r="20" fill="#ffffff" opacity="0.4"/>
    <rect x="-15" y="20" width="30" height="40" rx="15" fill="#ffffff" opacity="0.4"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="100" r="30" fill="#ffffff" opacity="0.1"/>
  <circle cx="750" cy="150" r="40" fill="#ffffff" opacity="0.1"/>
  <circle cx="700" cy="80" r="25" fill="#ffffff" opacity="0.15"/>
</svg>
