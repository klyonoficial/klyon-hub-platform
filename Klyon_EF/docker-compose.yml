version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: klyon-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: KlyonEF
      MYSQL_USER: klyon_user
      MYSQL_PASSWORD: klyon_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - klyon-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klyon-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mariadb;Database=KlyonEF;User=klyon_user;Password=klyon_pass;Port=3306;
    volumes:
      - ./wwwroot/documents:/app/wwwroot/documents
    networks:
      - klyon-network

volumes:
  mariadb_data:
    driver: local

networks:
  klyon-network:
    driver: bridge
