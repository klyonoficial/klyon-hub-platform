version: '3.8'

# Docker Compose apenas para desenvolvimento (apenas MariaDB)
# Use este arquivo se quiser rodar apenas o banco de dados e executar a aplicação localmente

services:
  mariadb:
    image: mariadb:10.5.29
    container_name: klyon-mariadb-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: klyon_hub_platform
      MYSQL_USER: klyon_user
      MYSQL_PASSWORD: klyon_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data_dev:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data_dev:
    driver: local
