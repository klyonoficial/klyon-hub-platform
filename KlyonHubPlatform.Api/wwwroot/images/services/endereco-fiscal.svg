<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGradient4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient4)"/>
  
  <!-- Building -->
  <rect x="250" y="150" width="300" height="350" rx="10" fill="url(#buildingGradient)" opacity="0.9"/>
  
  <!-- Building windows -->
  <g transform="translate(280, 200)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="50" height="60" rx="5" fill="#ffffff" opacity="0.3"/>
    <rect x="70" y="0" width="50" height="60" rx="5" fill="#ffffff" opacity="0.3"/>
    <rect x="140" y="0" width="50" height="60" rx="5" fill="#ffffff" opacity="0.3"/>
    <rect x="210" y="0" width="50" height="60" rx="5" fill="#ffffff" opacity="0.3"/>
    
    <!-- Row 2 -->
    <rect x="0" y="80" width="50" height="60" rx="5" fill="#ffffff" opacity="0.3"/>
    <rect x="70" y="80" width="50" height="60" rx="5" fill="#ffffff" opacity="0.3"/>
    <rect x="140" y="80" width="50" height="60" rx="5" fill="#ffffff" opacity="0.3"/>
    <rect x="210" y="80" width="50" height="60" rx="5" fill="#ffffff" opacity="0.3"/>
    
    <!-- Row 3 -->
    <rect x="0" y="160" width="50" height="60" rx="5" fill="#ffffff" opacity="0.3"/>
    <rect x="70" y="160" width="50" height="60" rx="5" fill="#ffffff" opacity="0.3"/>
    <rect x="140" y="160" width="50" height="60" rx="5" fill="#ffffff" opacity="0.3"/>
    <rect x="210" y="160" width="50" height="60" rx="5" fill="#ffffff" opacity="0.3"/>
  </g>
  
  <!-- Door -->
  <rect x="360" y="450" width="80" height="50" rx="5" fill="#ffffff" opacity="0.4"/>
  <circle cx="420" cy="475" r="3" fill="#ffffff" opacity="0.6"/>
  
  <!-- Address sign -->
  <rect x="300" y="100" width="200" height="40" rx="20" fill="#ffffff" opacity="0.9"/>
  <text x="400" y="125" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#667eea" text-anchor="middle">ENDEREÇO FISCAL</text>
  
  <!-- Document icon -->
  <g transform="translate(150, 300)">
    <rect x="0" y="0" width="60" height="80" rx="5" fill="#ffffff" opacity="0.7"/>
    <line x1="15" y1="20" x2="45" y2="20" stroke="#4facfe" stroke-width="2"/>
    <line x1="15" y1="35" x2="45" y2="35" stroke="#4facfe" stroke-width="2"/>
    <line x1="15" y1="50" x2="45" y2="50" stroke="#4facfe" stroke-width="2"/>
  </g>
  
  <!-- Checkmark icon -->
  <g transform="translate(590, 300)">
    <circle cx="0" cy="0" r="30" fill="#ffffff" opacity="0.7"/>
    <path d="M -10,0 L -3,7 L 10,-7" stroke="#4facfe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="40" fill="#ffffff" opacity="0.1"/>
  <circle cx="700" cy="120" r="35" fill="#ffffff" opacity="0.1"/>
  <circle cx="50" cy="550" r="30" fill="#ffffff" opacity="0.15"/>
</svg>
